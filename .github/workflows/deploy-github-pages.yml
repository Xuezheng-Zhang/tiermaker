# 部署静态前端到 GitHub Pages（联机仍依赖单独部署的后端，见下方 secrets）
#
# 使用前请在仓库 Settings → Secrets and variables → Actions 中新增：
#   VITE_SOCKET_URL = https://你的后端.onrender.com  （无末尾斜杠）
#
# 并在 Settings → Pages → Build and deployment → Source 选择「GitHub Actions」

name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          # 与 https://<用户>.github.io/<仓库名>/ 一致；若用自定义域名且部署在根路径，可改为 VITE_BASE_PATH=/
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_SOCKET_URL: ${{ secrets.VITE_SOCKET_URL }}
        run: npm run build

      # 刷新子路径时由 GitHub Pages 返回 404.html，与 index 相同以便 SPA 加载
      - name: SPA fallback (404.html)
        run: cp dist/index.html dist/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
